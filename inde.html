<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escríbeme por WhatsApp</title>
<style>
  :root{
    --wa:#25D366; --wa-dark:#1da851; --ink:#111b21; --muted:#667781;
    --bg:#f0f2f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:grid; place-items:center; padding:24px;
  }
  .card{
    background:#fff; width:100%; max-width:400px; border-radius:18px;
    padding:32px 26px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.10);
  }
  .avatar{
    width:96px; height:96px; border-radius:50%; margin:0 auto 18px;
    background:linear-gradient(135deg,var(--wa),var(--wa-dark));
    display:grid; place-items:center; color:#fff; font-size:38px; font-weight:700;
    position:relative;
  }
  .dot{
    position:absolute; right:4px; bottom:4px; width:20px; height:20px;
    border-radius:50%; background:var(--wa); border:3px solid #fff;
  }
  h1{font-size:21px; margin-bottom:6px}
  .sub{color:var(--muted); font-size:14.5px; line-height:1.5; margin-bottom:26px}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:15px; border:0; border-radius:12px; cursor:pointer;
    background:var(--wa); color:#fff; font-size:16.5px; font-weight:600;
    text-decoration:none; transition:background .15s, transform .1s;
  }
  .btn:hover{background:var(--wa-dark)}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px;fill:#fff}
  .copy{
    margin-top:14px; background:none; border:0; cursor:pointer;
    color:var(--muted); font-size:13.5px; text-decoration:underline;
  }
  .hint{margin-top:22px; font-size:12.5px; color:var(--muted)}
  .float{
    position:fixed; right:18px; bottom:18px; width:58px; height:58px;
    border-radius:50%; background:var(--wa); display:grid; place-items:center;
    box-shadow:0 6px 22px rgba(37,211,102,.45); text-decoration:none;
  }
  .float svg{width:30px;height:30px;fill:#fff}
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translate(-50%,14px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:.2s;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="card">
  <div class="avatar">A<span class="dot"></span></div>
  <h1>Nombre del negocio</h1>
  <p class="sub">Respondo en minutos. Pulsa el botón y el chat se abre solo, sin buscar mi número.</p>

  <!-- ▼ EDITA: número y mensaje -->
  <a class="btn" id="wa"
     href="https://wa.me/5215512345678?text=Hola%2C%20vengo%20de%20tu%20p%C3%A1gina%20y%20quiero%20informaci%C3%B3n"
     target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.8-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6l.5-.6c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.6.9 3.5.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.2-.2-.5-.4z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
    Abrir chat de WhatsApp
  </a>
  <button class="copy" id="copy">Copiar número</button>

  <p class="hint">Al pulsar se abre WhatsApp con el mensaje ya escrito.</p>
</div>

<a class="float" href="https://wa.me/5215512345678" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.8-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6l.5-.6c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.6.9 3.5.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.2-.2-.5-.4z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
</a>

<div class="toast" id="toast">Número copiado</div>

<script>
  // ▼ EDITA: mismo número en formato internacional, sin +
  const NUMERO = "5215512345678";

  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText("+" + NUMERO);
      const t = document.getElementById("toast");
      t.classList.add("on");
      setTimeout(() => t.classList.remove("on"), 1600);
    } catch { prompt("Copia el número:", "+" + NUMERO); }
  });

  // Registro opcional de clics (quita si no lo usas)
  document.querySelectorAll("[href*='wa.me']").forEach(el =>
    el.addEventListener("click", () => console.log("click WhatsApp"))
  );
</script>
</body>
</html>
